# Staging stack: API + Postgres + Redis + Meilisearch + MinIO
# Usage (from repo root):
#   cp infra/.env.staging.example infra/.env.staging
#   docker compose -f infra/docker-compose.staging.yml --env-file infra/.env.staging up -d --build

name: davart

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-davart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-davart}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-davart} -d ${POSTGRES_DB:-davart}"]
      interval: 5s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 8

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY}
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      # --spider sends HEAD; Meilisearch /health only accepts GET → false "unhealthy"
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 8

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 8
    ports:
      - "9000:9000"

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-davart}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-davart}?schema=public
      REDIS_URL: redis://redis:6379
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILI_MASTER_KEY}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      ALLOW_DEV_ENDPOINTS: "false"
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-davart}
      S3_REGION: us-east-1
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      TELEGRAM_GATEWAY_TOKEN: ${TELEGRAM_GATEWAY_TOKEN:-}
      TELEGRAM_GATEWAY_SENDER: ${TELEGRAM_GATEWAY_SENDER:-}
      SMS_FALLBACK_PROVIDER: ${SMS_FALLBACK_PROVIDER:-}
      SMSRU_API_ID: ${SMSRU_API_ID:-}
      P1SMS_API_KEY: ${P1SMS_API_KEY:-}
      P1SMS_BOT_USERNAME: ${P1SMS_BOT_USERNAME:-}
      P1SMS_CHANNEL: ${P1SMS_CHANNEL:-}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "3000:3000"

  # Cloudflare Tunnel (вариант B). Не публикует порты роутера.
  # Запуск: docker compose ... --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - api
      - minio
    profiles:
      - tunnel

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
  minio_data:
